services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: codefusionai-backend
    env_file:
      - ./Backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: codefusionai-frontend
    env_file:
      - ./Frontend/.env
    environment:
      VITE_BACKEND_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"

  redis:
    image: redis:7-alpine
    container_name: codefusionai-redis
    ports:
      - "6379:6379"
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      # Tests use the in-memory Redis fallback; point at a closed port so no server is needed.
      REDIS_URL: redis://127.0.0.1:1
      FIREBASE_PROJECT_ID: ci-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(find src -name '*.js'); do node --check "$f"; done
      - run: npm test

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
